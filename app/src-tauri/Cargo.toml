[package]
name = "app"
version = "0.1.0"
description = "A Tauri App"
authors = ["you"]
license = ""
repository = ""
edition = "2021"
rust-version = "1.88"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6.3", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
tauri = { version = "2.11.3", features = ["tray-icon", "image-png", "macos-private-api"] }
tauri-plugin-log = "2"
tauri-plugin-sql = { version = "2.4.0", features = ["sqlite"] }
tauri-plugin-dialog = "2.7.1"
# Pin no git: o 1.1.1 do crates.io crasha no boot em macOS 26 (null pointer no
# superview dos traffic lights ao criar janela SEM decoração — o tray-popover).
# Fix mergeado em ago/2025 (issue #46 / PR #47) mas nunca lançado. Voltar ao
# crates.io quando sair release > 1.1.1.
tauri-plugin-decorum = { git = "https://github.com/clearlysid/tauri-plugin-decorum", rev = "9f1f73636821c3cb8b940524214b940b7999ef6e" }
tokio = { version = "1", features = ["process", "io-util", "io-std", "net", "macros", "rt", "rt-multi-thread", "sync", "time"] }
toml_edit = "0.22"
blake3 = "1"      # hash do conteúdo de anexos (nome de arquivo + dedup)
semver = "1"      # versões e engine gate do manifesto de plugins
url = "2"         # validação fechada de endpoints MCP contribuídos
infer = "0.16"    # sniff de MIME por magic bytes (não confia no clipboard)
ignore = "0.4"    # árvore/busca locais com .gitignore e .ignore aninhados
tauri-plugin-opener = "2.5.4"
# Companion Web (servidor LAN embutido): HTTP+WS sobre o tokio já existente.
axum = { version = "0.8", features = ["ws", "multipart"] }
futures-util = "0.3" # split() do WebSocket do axum (Sink/Stream em arms separados do select!)
tokio-tungstenite = "0.29" # CDP do navegador do projeto, sempre em loopback
reqwest = { version = "0.13", default-features = false, features = ["json"] } # HTTP CDP local, sem depender de curl instalado
# ATENÇÃO: rusqlite 0.32 = libsqlite3-sys 0.30, o MESMO do sqlx (tauri-plugin-sql).
# links="sqlite3" só admite UMA versão no grafo — não suba sem alinhar com o sqlx.
rusqlite = { version = "0.32", features = ["bundled"] } # leitura READ-ONLY do mycockpit.db
rand = "0.10" # token + ids aleatórios do companion
tauri-plugin-notification = "2"
window-vibrancy = "0.6" # NSVisualEffectView no popover da tray (blur nativo)
# Token OAuth dos MCPs remotos (mcp_auth.rs). O default `v1` já seleciona o
# store `apple-native-keyring-store/keychain` no macOS — o Keychain LEGADO, que
# é o único que funciona sem entitlement/Team ID (o `protected` devolve -34018
# em app sem App ID). MIT OR Apache-2.0.
keyring = "4.1"
tauri-plugin-clipboard-manager = "2.3.2"

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6.4"
block2 = "0.6.2"
objc2-app-kit = { version = "0.3.2", default-features = false, features = ["NSAlert", "NSApplication", "NSButton", "NSControl", "NSEvent", "NSResponder", "NSScreen", "NSView", "NSWindow", "objc2-core-graphics"] }
objc2-foundation = { version = "0.3.2", default-features = false, features = ["NSArray", "NSGeometry", "NSNotification", "NSObject", "NSOperation", "NSString", "block2", "objc2-core-foundation"] }
objc2-core-foundation = { version = "0.3.2", default-features = false, features = ["std", "CFString", "CFUUID"] }
objc2-core-graphics = { version = "0.3.2", default-features = false, features = ["CGDirectDisplay", "CGWindow"] }

[dev-dependencies]
tauri = { version = "2.11.3", features = ["test"] } # runtime simulado para contratos de janela nativa
tower = { version = "0.5", features = ["util"] } # oneshot() nos testes do guard do companion

# Resolver MSRV-aware (boa prática). Toolchain local: rustc 1.96 (Homebrew).
[workspace]
resolver = "3"
