[package]
name = "app"
version = "0.1.0"
description = "A Tauri App"
authors = ["you"]
license = ""
repository = ""
edition = "2021"
rust-version = "1.88"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6.3", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
tauri = { version = "2.11.3", features = [] }
tauri-plugin-log = "2"
tauri-plugin-sql = { version = "2.4.0", features = ["sqlite"] }
tauri-plugin-dialog = "2.7.1"
tauri-plugin-decorum = "1.1.1"
tokio = { version = "1", features = ["process", "io-util", "macros", "rt", "sync"] }
toml_edit = "0.22"
blake3 = "1"      # hash do conteúdo de anexos (nome de arquivo + dedup)
infer = "0.16"    # sniff de MIME por magic bytes (não confia no clipboard)
tauri-plugin-opener = "2.5.4"
tauri-plugin-notification = "2"

# Resolver MSRV-aware (boa prática). Toolchain local: rustc 1.96 (Homebrew).
[workspace]
resolver = "3"
