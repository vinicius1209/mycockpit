<!doctype html>
<html lang="pt-BR" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>MyCockpit</title>
    <style>
      /* anti-flash: pinta o fundo grafite antes do CSS carregar */
      html {
        background: #0a0b0d;
      }
      /* desktop feel: UI não-selecionável; texto selecionável onde importa */
      body {
        user-select: none;
        -webkit-user-select: none;
      }
      input,
      textarea,
      [contenteditable],
      [data-selectable] {
        user-select: text;
        -webkit-user-select: text;
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
