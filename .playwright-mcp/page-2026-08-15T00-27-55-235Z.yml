              - paragraph [ref=f3e136]:
                - text: A parte interessante do
                - code [ref=f3e137]: check-type-scale
                - text: "é que ele não inventa régua própria: ele repete o mapa de migração do guia. Quando dispara, já diz o arquivo:linha, o valor achado"
                - emphasis [ref=f3e138]: e
                - text: a parada de destino, então o conserto não depende de julgamento estético de quem está com o teclado na mão.
              - code [ref=f3e140]: "/** * A parada de destino de um valor em px: o que o §3 mandar, e fora do * mapa a parada mais próxima (empate desce, porque ênfase acima de 14 * se faz com peso e não com tamanho). */ export function paradaMaisProxima(px) { const doMapa = MAPA_DE_MIGRACAO.get(px); if (doMapa != null) return doMapa; return maisProximaPorDistancia(px); }"
              - paragraph [ref=f3e141]:
                - text: "Repare no que o mapa faz com os valores em discussão:"
                - code [ref=f3e142]: "15"
                - text: e
                - code [ref=f3e143]: "16"
