    - heading "02A cena, com os vizinhos" [level=2] [ref=f3e75]
    - paragraph [ref=f3e76]: "A prosa nunca aparece sozinha. Acima dela: nome do agent (13), modelo e custo em mono (11), linha de ferramenta (rótulo 12, caminho 11, duração 11). Abaixo: controles da mensagem (13) e chip de plano (12). O risco do 15/16 não é a prosa ficar feia, é a prosa descolar da vizinhança e a hierarquia embaralhar. A linha tracejada é a dobra de um viewport de 900px de altura."
