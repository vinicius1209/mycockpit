                - text: ", e na largura mínima de 190px a palavra \"IMPLEMENTAÇÃO\" comia o título inteiro. A saída não foi voltar o tamanho, porque a escala é lei, nem inventar um rótulo curto, porque o §7 fecha o vocabulário: caiu o"
                - code [ref=f2e159]: uppercase
