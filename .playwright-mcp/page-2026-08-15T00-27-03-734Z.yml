      - code [ref=f2e32]: index.css
      - text: ", mesma família (Geist embutida). Só o tamanho da prosa muda, e o que cada tamanho exige junto."
    - heading "01A régua usada" [level=2] [ref=f2e33]
    - paragraph [ref=f2e34]: "Comparar 14 e 16 com a mesma entrelinha e a mesma largura é comparação viciada: o tamanho maior pede razão de entrelinha MENOR (a linha já é alta em px) e medida maior em px. Aqui cada coluna recebe o que o tamanho pede. O botão travada 1,625 mostra de propósito a comparação viciada, pra ver a diferença entre \"16px é grande demais\" e \"16px com entrelinha errada é grande demais\"."
