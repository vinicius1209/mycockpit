                - text: feito à mão, que o §3 já proibia. Sentence case custa cerca de 74px contra 92px em caixa-alta, menos do que o badge ocupava antes da migração.
              - paragraph [ref=f2e161]: "É o tipo de conserto que só aparece quando a regra é decidível: com \"use o bom senso\" no lugar do número, o caminho óbvio teria sido abrir uma exceção de 9,5px para a sidebar, e daí a dois sprints teríamos 19 tamanhos de novo."
