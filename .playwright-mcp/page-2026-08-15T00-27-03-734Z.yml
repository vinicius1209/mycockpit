                      - code [ref=f2e135]: shadow-md/lg/xl/2xl
                      - text: ", ou entra travessão em prosa de UI"
              - paragraph [ref=f2e136]:
                - text: A parte interessante do
                - code [ref=f2e137]: check-type-scale
                - text: "é que ele não inventa régua própria: ele repete o mapa de migração do guia. Quando dispara, já diz o arquivo:linha, o valor achado"
                - emphasis [ref=f2e138]: e
                - text: a parada de destino, então o conserto não depende de julgamento estético de quem está com o teclado na mão.
              - code [ref=f2e140]: "/** * A parada de destino de um valor em px: o que o §3 mandar, e fora do * mapa a parada mais próxima (empate desce, porque ênfase acima de 14 * se faz com peso e não com tamanho). */ export function paradaMaisProxima(px) { const doMapa = MAPA_DE_MIGRACAO.get(px); if (doMapa != null) return doMapa; return maisProximaPorDistancia(px); }"
              - paragraph [ref=f2e141]:
                - text: "Repare no que o mapa faz com os valores em discussão:"
                - code [ref=f2e142]: "15"
                - text: e
                - code [ref=f2e143]: "16"
                - text: estão explicitamente listados como "vira
                - code [ref=f2e144]: "14"
                - text: "\". Não é omissão nem lacuna a preencher: é uma decisão escrita, e mexer nela é mexer na decisão, não no script."
              - heading "As três regras de convívio" [level=3] [ref=f2e145]
              - list [ref=f2e146]:
