                - text: chegou a 2,8 mil linhas, e foi exatamente ali que 11 varreduras O(N) se esconderam. A guarda de tamanho de arquivo não protege estética, protege a chance de alguém achar o bug.
              - paragraph [ref=f2e156]:
                - text: O efeito colateral mais instrutivo da passada apareceu na sidebar. O badge de estágio deu o maior salto (9,5 para 11px) num
                - code [ref=f2e157]: shrink-0
