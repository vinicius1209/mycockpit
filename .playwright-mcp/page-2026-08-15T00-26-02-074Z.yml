                  - text: "Nunca suba o teto, nunca edite a baseline à mão, nunca adicione exceção. A baseline só encolhe: quando um arquivo baixa,"
                  - code [ref=f1e149]: bun run check:file-size -- --update
                  - text: desce o número dele, e a guarda cobra isso, senão a catraca afrouxa sozinha.
                - listitem [ref=f1e150]:
                  - strong [ref=f1e151]: Tamanho novo na escala exige ADR mais linha no §3
                  - text: ", não exceção no script. O erro já diz o arquivo:linha, o valor achado e a parada de destino."
                - listitem [ref=f1e152]:
                  - strong [ref=f1e153]: Exceção de token morto é por arquivo, com contagem e motivo escrito
                  - text: "no mapa da regra. O número congela: o verde de marco que já existe continua, verde novo não entra. Exceção que sobrou folgada aparece como nota no fim da varredura, pra ser apertada."
