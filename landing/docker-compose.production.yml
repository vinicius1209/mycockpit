services:
  landing:
    image: nginx:1.27-alpine
    container_name: frota-landing
    restart: unless-stopped
    volumes:
      - ./dist:/usr/share/nginx/html:ro
      - ./deploy/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    networks:
      - coolify
    labels:
      - traefik.enable=true
      - traefik.docker.network=coolify
      - traefik.http.middlewares.frota-redirect-to-https.redirectscheme.scheme=https
      - traefik.http.routers.frota-http.entryPoints=http
      - traefik.http.routers.frota-http.middlewares=frota-redirect-to-https
      - traefik.http.routers.frota-http.rule=Host(`frota.vinimachado.dev`)
      - traefik.http.routers.frota-http.service=frota-http
      - traefik.http.routers.frota-https.entryPoints=https
      - traefik.http.routers.frota-https.middlewares=gzip
      - traefik.http.routers.frota-https.rule=Host(`frota.vinimachado.dev`)
      - traefik.http.routers.frota-https.service=frota-https
      - traefik.http.routers.frota-https.tls=true
      - traefik.http.routers.frota-https.tls.certresolver=letsencrypt
      - traefik.http.services.frota-http.loadbalancer.server.port=80
      - traefik.http.services.frota-https.loadbalancer.server.port=80

networks:
  coolify:
    external: true
