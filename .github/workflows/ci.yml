# CI mínima do MyCockpit: o projeto que cobra gates de verificação passa a ter
# os próprios. Front (tsc + lint + testes) em ubuntu; Rust em macOS (plataforma
# real do app, com swiftc pro sidecar de ditado); guardas de estilo num job
# separado, pra falha de lint nunca ser confundida com falha de teste.
name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  # As guardas do STYLEGUIDE (§10). Sem dependência: node puro, segundos. Job
  # próprio de propósito — quem vê "guardas de estilo" vermelho sabe na hora
  # que é regra de design violada, não teste quebrado.
  guardas:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "22" }
      - name: escala tipográfica (§3)
        run: node scripts/check-type-scale.mjs
      - name: ratchet de tamanho de arquivo
        run: node scripts/check-file-size-ratchet.mjs
      - name: tokens mortos (§2 · §4 · §7)
        run: node scripts/check-dead-tokens.mjs
      - name: movimento do "rodando" (§6)
        run: node scripts/lints/rodandoMotion.mjs
      - name: paleta crua (§2 · cor só por token)
        run: node scripts/lints/paletaCrua.mjs
      - name: barra de acento (§2 · seleção não é cor)
        run: node scripts/check-barra-de-acento.mjs
      - name: marca (o produto se chama Frota)
        run: node scripts/check-marca.mjs
      - name: guia sem arquivo:linha (§0)
        run: node scripts/check-guia-sem-linha.mjs
      - name: superfícies das Configurações (catraca)
        run: node scripts/check-superficies.mjs
      - name: primitivas de superfície (§12 · vendor só em components/ui)
        run: node scripts/check-primitivas.mjs
      - name: geometria de controle (§13 · catraca)
        run: node scripts/check-geometria-de-controle.mjs
      - name: filete (§4 · dois papéis, catraca)
        run: node scripts/check-filete.mjs
      - name: config de agent (nada fixo desta máquina)
        run: node scripts/check-config-de-agent.mjs

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run: { working-directory: app }
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      # `-b`, e não `--noEmit`: o build usa `-b`, e a diferença já deixou passar
      # um erro (teste importando `node:fs`, que o tsconfig de `src/` não
      # conhece). Guarda que roda um comando diferente do build guarda outra
      # coisa.
      - name: typecheck
        run: bunx tsc -b --force
      - name: lint
        run: bun run lint
      # Guarda de FLUIDEZ antes da suíte inteira: falha aqui é regressão de
      # custo por token (identidade de prop quebrada, derivação desescopada), e
      # ela precisa ser legível como tal, não enterrada em 3.656 testes. Mesma
      # razão pela qual as guardas de estilo têm job próprio.
      - name: guarda de fluidez (custo por token)
        run: bun run check:fluidez
      - name: testes
        run: bun run test
      # Smoke-test de BOOT: sobe o app buildado num chromium headless e checa que
      # ele RENDERIZA (sem tela preta / loop de useSyncExternalStore). Pega a
      # classe de bug que tsc+lint+unit NÃO pegam. O webServer do playwright.config
      # faz o `bun run build` + `vite preview`.
      - name: instala chromium (playwright)
        run: bunx playwright install --with-deps chromium
      - name: smoke-test de boot (e2e)
        run: bun run test:e2e

  rust:
    runs-on: macos-14
    defaults:
      run: { working-directory: app/src-tauri }
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with: { workspaces: app/src-tauri }
      - name: cargo check
        run: cargo check --locked
