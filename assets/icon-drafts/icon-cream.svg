    <circle cx="512" cy="512" r="390" fill="none" stroke="#0a0b0d" stroke-opacity="0.035" stroke-width="2"/>
    <circle cx="512" cy="512" r="315" fill="none" stroke="#0a0b0d" stroke-opacity="0.045" stroke-width="2"/>
    <path d="M88 236C192 122 350 78 512 78c242 0 396 128 444 318V68H68v888h888V626C900 834 747 946 512 946 268 946 88 795 88 552Z" fill="#ffffff" opacity="0.42"/>
    <rect x="68" y="68" width="888" height="888" filter="url(#grain)" opacity="0.42"/>
  </g>

  <rect x="82" y="82" width="860" height="860" rx="194" fill="none" stroke="#ffffff" stroke-opacity="0.72" stroke-width="2"/>
  <rect x="100" y="100" width="824" height="824" rx="178" fill="none" stroke="#0a0b0d" stroke-opacity="0.08" stroke-width="2"/>

  <g filter="url(#brass-shadow)" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="512" cy="512" r="225" fill="none" stroke="url(#brass-soft)" stroke-width="28"/>
    <circle cx="512" cy="512" r="225" fill="none" stroke="#fbfbfa" stroke-opacity="0.72" stroke-width="12"/>
    <circle cx="512" cy="512" r="225" fill="none" stroke="url(#brass)" stroke-width="14"/>

    <path d="M512 164v150M512 710v150M164 512h150M710 512h150" stroke="#fbfbfa" stroke-opacity="0.78" stroke-width="44"/>
    <path d="M512 164v150M512 710v150M164 512h150M710 512h150" stroke="url(#brass)" stroke-width="30"/>
    <path d="M512 176v122M512 726v122M176 512h122M726 512h122" stroke="#fff7e5" stroke-opacity="0.32" stroke-width="7"/>

    <circle cx="512" cy="512" r="62" fill="#fbfbfa" fill-opacity="0.88" stroke="url(#brass-soft)" stroke-width="12"/>
    <circle cx="512" cy="512" r="36" fill="url(#brass)"/>
    <circle cx="500" cy="498" r="11" fill="#fff1d1" opacity="0.46"/>
