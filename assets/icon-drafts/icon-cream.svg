<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024" role="img" aria-label="Frota app icon reticle light">
  <defs>
    <linearGradient id="bg" x1="180" y1="78" x2="844" y2="946" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#fbfbfa"/>
      <stop offset="0.45" stop-color="#f6f6f4"/>
      <stop offset="1" stop-color="#ece9e3"/>
    </linearGradient>
    <radialGradient id="plate" cx="50%" cy="42%" r="68%">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="0.72" stop-color="#f6f6f4"/>
      <stop offset="1" stop-color="#ebe7df"/>
    </radialGradient>
    <linearGradient id="brass" x1="304" y1="214" x2="735" y2="829" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#d7a25a"/>
      <stop offset="0.2" stop-color="#b98238"/>
      <stop offset="0.56" stop-color="#7d531e"/>
      <stop offset="0.82" stop-color="#a9742b"/>
      <stop offset="1" stop-color="#543915"/>
    </linearGradient>
    <linearGradient id="brass-soft" x1="257" y1="168" x2="767" y2="856" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#c9944d" stop-opacity="0.58"/>
      <stop offset="0.5" stop-color="#a9742b" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#6f4819" stop-opacity="0.38"/>
    </linearGradient>
    <filter id="outer-shadow" x="-12%" y="-12%" width="124%" height="124%">
      <feDropShadow dx="0" dy="34" stdDeviation="32" flood-color="#756c5e" flood-opacity="0.24"/>
      <feDropShadow dx="0" dy="-2" stdDeviation="1.5" flood-color="#ffffff" flood-opacity="0.65"/>
    </filter>
    <filter id="brass-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="10" flood-color="#5f4a2a" flood-opacity="0.22"/>
      <feDropShadow dx="0" dy="-1" stdDeviation="1.2" flood-color="#fff8ea" flood-opacity="0.42"/>
    </filter>
    <filter id="grain" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="2" seed="18"/>
      <feColorMatrix type="saturate" values="0"/>
      <feComponentTransfer>
        <feFuncA type="table" tableValues="0 0.025"/>
      </feComponentTransfer>
    </filter>
    <clipPath id="squircle">
      <rect x="68" y="68" width="888" height="888" rx="206"/>
    </clipPath>
  </defs>

  <rect x="68" y="68" width="888" height="888" rx="206" fill="url(#bg)" filter="url(#outer-shadow)"/>
  <g clip-path="url(#squircle)">
